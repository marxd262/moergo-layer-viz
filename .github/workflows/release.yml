name: Release

# Push a tag like `v0.1.0` to build the artifacts and publish a GitHub Release.
# `workflow_dispatch` lets you build the artifacts manually without releasing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build-windows:
    name: Build Windows (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.0.1

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/MoergoLayerViz.App/MoergoLayerViz.App.csproj \
            -c Release -r win-x64 --self-contained true \
            -f net10.0 \
            -p:PublishSingleFile=false \
            -p:Version=${{ steps.ver.outputs.version }}

      - name: Download previous releases for delta baseline
        shell: bash
        # vpk pack only computes a delta if previous full.nupkg files are
        # present in --outputDir. On the very first release this finds
        # nothing — that's fine; continue-on-error lets the job proceed.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ./vpk-output
          vpk download github \
            --repoUrl https://github.com/ovandongen/moergo-layer-viz \
            --channel win-x64 \
            --outputDir ./vpk-output \
            --token "$GITHUB_TOKEN"

      - name: Pack with Velopack
        shell: bash
        run: |
          publish="src/MoergoLayerViz.App/bin/Release/net10.0/win-x64/publish"
          vpk pack \
            --packId MoergoLayerViz \
            --packVersion ${{ steps.ver.outputs.version }} \
            --packDir "$publish" \
            --mainExe MoergoLayerViz.App.exe \
            --packTitle "MoergoLayerViz" \
            --packAuthors "ovandongen" \
            --channel win-x64 \
            --outputDir ./vpk-output
          ls -lh ./vpk-output

      - name: Prune older-version nupkgs
        shell: bash
        # vpk download pulled prior releases' full.nupkg as the delta
        # baseline; the pack step has now consumed them. Strip anything
        # not stamped with the current version so the Release page only
        # shows v${ver} assets.
        run: |
          ver="${{ steps.ver.outputs.version }}"
          find ./vpk-output -name "MoergoLayerViz-*.nupkg" ! -name "MoergoLayerViz-${ver}-*" -delete
          ls -lh ./vpk-output

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: vpk-output/**
          if-no-files-found: error

  build-macos:
    name: Build macOS (${{ matrix.rid }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.0.1

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
          echo "arch=${RID#osx-}" >> "$GITHUB_OUTPUT"
        env:
          RID: ${{ matrix.rid }}

      - name: Stamp version into Info.plist
        run: |
          # Mutate the source plist before the script copies+signs the bundle,
          # otherwise editing the in-bundle plist would invalidate codesign.
          PLIST="build/macos/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.ver.outputs.version }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.ver.outputs.version }}" "$PLIST"

      - name: Build .app bundle
        run: |
          # CI has no "MoergoLayerViz Local Dev" Keychain cert; the script
          # falls back to ad-hoc signing automatically. End users may need
          # to re-grant Accessibility after upgrades — see README macOS notes.
          scripts/build-mac-app.sh -c Release -r ${{ matrix.rid }} -v ${{ steps.ver.outputs.version }}

      - name: Download previous releases for delta baseline
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ./vpk-output
          vpk download github \
            --repoUrl https://github.com/ovandongen/moergo-layer-viz \
            --channel osx-${{ steps.ver.outputs.arch }} \
            --outputDir ./vpk-output \
            --token "$GITHUB_TOKEN"

      - name: Pack with Velopack
        run: |
          app="src/MoergoLayerViz.App/bin/macos-bundle/MoergoLayerViz.app"
          vpk pack \
            --packId MoergoLayerViz \
            --packVersion ${{ steps.ver.outputs.version }} \
            --packDir "$app" \
            --mainExe MoergoLayerViz \
            --packTitle "MoergoLayerViz" \
            --packAuthors "ovandongen" \
            --channel osx-${{ steps.ver.outputs.arch }} \
            --outputDir ./vpk-output
          ls -lh ./vpk-output

      - name: Prune older-version nupkgs
        run: |
          ver="${{ steps.ver.outputs.version }}"
          find ./vpk-output -name "MoergoLayerViz-*.nupkg" ! -name "MoergoLayerViz-${ver}-*" -delete
          ls -lh ./vpk-output

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ steps.ver.outputs.arch }}
          path: vpk-output/**
          if-no-files-found: error

  build-linux:
    name: Build Linux (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.0.1

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/MoergoLayerViz.App/MoergoLayerViz.App.csproj \
            -c Release -r linux-x64 --self-contained true \
            -f net10.0 \
            -p:PublishSingleFile=false \
            -p:Version=${{ steps.ver.outputs.version }}

      - name: Download previous releases for delta baseline
        shell: bash
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ./vpk-output
          vpk download github \
            --repoUrl https://github.com/ovandongen/moergo-layer-viz \
            --channel linux-x64 \
            --outputDir ./vpk-output \
            --token "$GITHUB_TOKEN"

      - name: Pack with Velopack (AppImage)
        shell: bash
        run: |
          publish="src/MoergoLayerViz.App/bin/Release/net10.0/linux-x64/publish"
          vpk [linux] pack \
            --packId MoergoLayerViz \
            --packVersion ${{ steps.ver.outputs.version }} \
            --packDir "$publish" \
            --mainExe MoergoLayerViz.App \
            --packTitle "MoergoLayerViz" \
            --packAuthors "ovandongen" \
            --icon src/MoergoLayerViz.App/Assets/icon.png \
            --channel linux-x64 \
            --outputDir ./vpk-output
          ls -lh ./vpk-output

      - name: Prune older-version nupkgs
        shell: bash
        run: |
          ver="${{ steps.ver.outputs.version }}"
          find ./vpk-output -name "MoergoLayerViz-*.nupkg" ! -name "MoergoLayerViz-${ver}-*" -delete
          ls -lh ./vpk-output

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: vpk-output/**
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**
          generate_release_notes: true
          fail_on_unmatched_files: true
